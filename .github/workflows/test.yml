name: 測試

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # WaveCanvas 只支援 Windows，部分測試依賴 Windows 路徑規則。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # 單元測試不需要 Electron 執行檔，略過下載以加快速度。
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test
