<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="WaveCanvas">
  <!-- 小尺寸版（32 px 以下與工具列）：線條對齊像素格，長條減為 5 根。 -->
  <rect width="32" height="32" rx="7" fill="#201f1d"/>
  <g fill="#e2a73b">
    <rect x="5" y="11" width="3" height="10" rx="1.5"/>
    <rect x="9" y="7" width="3" height="18" rx="1.5"/>
    <rect x="13" y="10" width="3" height="12" rx="1.5"/>
  </g>
  <rect x="17" y="4" width="2" height="24" rx="1" fill="#e8e4dc"/>
  <g fill="#6b665e">
    <rect x="20" y="8" width="3" height="16" rx="1.5"/>
    <rect x="24" y="12" width="3" height="8" rx="1.5"/>
  </g>
</svg>
