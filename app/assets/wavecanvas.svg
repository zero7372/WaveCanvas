<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="WaveCanvas">
  <!-- 播放頭波形：左側已播放（琥珀色）、右側未播放（灰），中間是播放頭。用於 48 px 以上。 -->
  <rect width="256" height="256" rx="56" fill="#201f1d"/>
  <g fill="#e2a73b">
    <rect x="42" y="102" width="16" height="52" rx="8"/>
    <rect x="66" y="74" width="16" height="108" rx="8"/>
    <rect x="90" y="54" width="16" height="148" rx="8"/>
    <rect x="114" y="84" width="16" height="88" rx="8"/>
  </g>
  <rect x="139" y="36" width="8" height="184" rx="4" fill="#e8e4dc"/>
  <g fill="#6b665e">
    <rect x="156" y="66" width="16" height="124" rx="8"/>
    <rect x="180" y="92" width="16" height="72" rx="8"/>
    <rect x="204" y="110" width="16" height="36" rx="8"/>
  </g>
</svg>
